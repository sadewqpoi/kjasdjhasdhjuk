<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوابة دفع تجريبية</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main>
    <div class="card narrow" style="text-align:center">
      <div class="alert warn">بوابة دفع تجريبية لبيئة التطوير فقط — لا يتم خصم أي مبلغ حقيقي</div>
      <h2>إتمام الدفع</h2>
      <p class="price" id="amount" style="font-size:2rem;font-weight:800">…</p>
      <div class="field" style="text-align:right"><label>وسيلة الدفع</label>
        <select id="method"><option value="mada">مدى</option><option value="applepay">Apple Pay</option><option value="creditcard">فيزا / ماستركارد</option></select></div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="pay">دفع (محاكاة نجاح)</button>
        <button class="btn danger" id="fail">محاكاة فشل</button>
      </div>
      <p id="err" class="small" style="color:var(--danger)"></p>
    </div>
  </main>
  <script src="/js/mock-gateway.js"></script>
</body>
</html>
